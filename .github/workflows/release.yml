name: Publish Air Neo release

on:
  push:
    branches: ["main"]
    paths:
      - "SpatialDesk_round79.zip"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Publish packaged application
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.79.0
          name: Air Neo 0.79 — Round 79
          target_commitish: main
          make_latest: true
          generate_release_notes: false
          body: |
            ## Air Neo 0.79 (Round 79)

            Experimental Windows application package for Air Neo.

            1. Download **Air-Neo-0.79-Windows.zip** below.
            2. Extract the ZIP.
            3. Read the repository README for setup instructions.

            Check the README for current compatibility, known issues, and feature status. This development build is not a claim that every planned capability is implemented.
          files: |
            SpatialDesk_round79.zip
          fail_on_unmatched_files: true
      - name: Publish a cleanly named Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SpatialDesk_round79.zip Air-Neo-0.79-Windows.zip
          gh release upload v0.79.0 Air-Neo-0.79-Windows.zip --clobber
          gh release delete-asset v0.79.0 SpatialDesk_round79.zip --yes
