<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Air Neo — an independent spatial desktop project for RayNeo AR glasses.">
<title>Air Neo — Spatial workspace</title>
<style>
:root{color-scheme:dark;--bg:#090a0d;--surface:#111317;--surface-hover:#171a20;--line:rgba(255,255,255,.065);--muted:#858b98;--text:#f2f3f6;--blue:#a9c7f2}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100svh;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;overflow-x:hidden}
button,a{font:inherit}
a{color:inherit;text-decoration:none}
main{width:min(440px,calc(100% - 36px));text-align:center;padding:54px 0 40px;animation:appear .7s ease both}
h1{font-size:32px;line-height:1.15;letter-spacing:-1.15px;font-weight:680;margin:0 0 17px}
.subtitle{font-size:12px;color:#858b98;margin:0 0 27px}
.account{width:110px;height:130px;margin:0 auto;border:1px solid rgba(255,255,255,.055);border-radius:17px;background:#111317;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:background .2s,border-color .2s,transform .2s;cursor:pointer}
.account:hover{background:var(--surface-hover);border-color:rgba(169,199,242,.23);transform:translateY(-2px)}
.orb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 24%,#e1e9f7 0,#9eacc2 25%,#53627b 58%,#182133 100%);box-shadow:inset -8px -10px 18px rgba(5,11,22,.5),0 4px 20px rgba(0,0,0,.25);position:relative;overflow:hidden}
.orb:before{content:"";position:absolute;inset:1px;border-radius:50%;background:linear-gradient(140deg,rgba(255,255,255,.3),transparent 48%)}
.mark{position:relative;font-size:38px;line-height:1;font-weight:800;letter-spacing:-5px;color:#f4f7fd;text-shadow:0 2px 6px rgba(0,0,0,.28);transform:translateX(-2px)}
.account-name{font-size:11px;color:#f0f1f4;font-weight:550}
.note{margin:58px 0 17px;color:#707783;font-size:9px;letter-spacing:.05px}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.pill{border:1px solid rgba(255,255,255,.09);background:transparent;color:#a7adba;border-radius:999px;padding:7px 13px;font-size:10px;transition:all .2s;cursor:pointer}
.pill:hover{border-color:rgba(255,255,255,.2);color:#f3f5f8;background:rgba(255,255,255,.035)}
.pill.primary{color:#d9e6f8;border-color:rgba(169,199,242,.22);background:rgba(116,151,204,.08)}
footer{position:fixed;bottom:19px;left:0;right:0;text-align:center;color:#515762;font-size:9px;letter-spacing:.15px}
footer a{color:#818b9b;transition:color .2s}footer a:hover{color:#dce7f8}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-height:520px){main{padding:25px 0 45px}.note{margin-top:30px}footer{position:static;padding:0 0 15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Air Neo</h1>
  <p class="subtitle">Your spatial workspace</p>
  <a class="account" href="https://github.com/AverageDev143/Air-Neo/archive/refs/heads/main.zip" aria-label="Download the Air Neo project">
    <span class="orb" aria-hidden="true"><span class="mark">A</span></span>
    <span class="account-name">Air Neo</span>
  </a>
  <p class="note">An independent project for RayNeo AR glasses. Free to explore.</p>
  <div class="actions">
    <a class="pill primary" href="https://github.com/AverageDev143/Air-Neo/archive/refs/heads/main.zip">Get the project ↓</a>
    <a class="pill" href="https://github.com/AverageDev143/Air-Neo" target="_blank" rel="noreferrer">View source ↗</a>
  </div>
</main>
<footer>Built independently · <a href="https://github.com/AverageDev143/Air-Neo">GitHub</a></footer>
</body>
</html>
